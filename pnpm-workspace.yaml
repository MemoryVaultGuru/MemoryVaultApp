packages:
  - memorysmith-frontend
  - memorysmith-backend
  - memorysmith-backend/packages/*
  - memorysmith-backend/services/*
  - memorysmith-backend/apps/*
  - memorysmith-infra

allowBuilds:
  esbuild: true

# The published specification the product implements, pinned to one version
# in one place. Two packages read it -- the contracts, which derive the
# declared notation from it, and the frontend, whose reading surface is
# proved against the same cases -- and a catalog is what keeps them from
# pinning two different versions of the same specification.
catalog:
  '@memorysmith/markdown-profile': github:memorysmithapp/markdown-profile#v0.3.0
